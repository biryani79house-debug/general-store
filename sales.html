<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; connect-src 'self' https://web-production-9d240.up.railway.app https://unpkg.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https: 'data:'; frame-src 'self' https://wa.me;">
    <title>Raza Wholesale and Retail - Online Order</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .gradient-bg {
            background: linear-gradient(rgba(132, 206, 248, 0.95), rgba(172, 124, 20, 0.45));
            background-attachment: fixed;
            min-height: 100vh;
        }
        .glass-effect {
            background: rgba(236, 49, 49, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .product-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.99);
        }
        .pulse-cart {
            animation: pulse 2s infinite;
        }
        .bounce-in {
            animation: bounceIn 0.6s ease-out;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        .slide-up {
            animation: slideUp 0.4s ease-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Enhanced Mobile Styles */
        @media (max-width: 640px) {
            /* Mobile - Small screens (phones) */
            .gradient-bg {
                padding: 0.75rem;
            }
            .product-grid {
                grid-template-columns: repeat(1, 1fr) !important;
                gap: 1rem !important;
            }
            .product-card {
                min-height: 140px;
                padding: 1rem;
            }
            header {
                padding: 0.75rem;
            }
            .cart-modal-content {
                margin: 0.5rem;
                max-height: 85vh;
            }
            .notification {
                left: 10px;
                right: 10px;
                top: 10px;
                padding: 12px 16px;
                border-radius: 8px;
            }
            .cart-floating {
                bottom: 16px;
                right: 16px;
            }
            .slide-up, .bounce-in, .fade-in {
                animation-duration: 0.3s;
            }
        }

        @media (min-width: 641px) and (max-width: 768px) {
            /* Mobile Large / Small Tablet */
            .gradient-bg {
                padding: 1rem;
            }
            .product-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 1rem !important;
            }
            .product-card {
                min-height: 160px;
                padding: 1.25rem;
            }
            .cart-floating {
                bottom: 18px;
                right: 18px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            /* Tablet / Small Desktop */
            .product-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 1.5rem !important;
            }
            .product-card {
                min-height: 180px;
                padding: 1.5rem;
            }
            main { max-width: 1000px !important; }
        }

        @media (min-width: 1025px) and (max-width: 1280px) {
            /* Desktop */
            .product-grid {
                grid-template-columns: repeat(4, 1fr) !important;
                gap: 1.5rem !important;
            }
            .product-card {
                min-height: 200px;
                padding: 1.5rem;
            }
            main { max-width: 1200px !important; }
        }

        @media (min-width: 1281px) {
            /* Large Desktop */
            .product-grid {
                grid-template-columns: repeat(5, 1fr) !important;
                gap: 2rem !important;
            }
            .product-card {
                min-height: 220px;
                padding: 1.75rem;
            }
            main { max-width: 1400px !important; }
        }

        /* Touch-friendly interactions for mobile */
        @media (hover: none) and (pointer: coarse) {
            .product-card:hover {
                transform: none;
            }
            .product-card:active {
                transform: scale(0.98);
            }
            button:active {
                transform: scale(0.95);
            }
        }

        /* Safe area for mobile devices with notches */
        @supports (padding: max(0px)) {
            .cart-floating {
                bottom: max(16px, env(safe-area-inset-bottom));
                right: max(16px, env(safe-area-inset-right));
            }
        }

        .cart-floating {
            position: fixed;
            z-index: 50;
            transition: all 0.3s ease;
            transform-origin: center;
        }

        .cart-floating:hover {
            transform: scale(1.05);
        }

        /* Improved backdrop blur support */
        @supports (backdrop-filter: blur(10px)) {
            .product-card,
            .notification,
            .bg-white\/90 {
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 60;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            font-weight: 600;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        // Constants
        const BACKEND_URL = "https://web-production-9d240.up.railway.app";
        const SHOPKEEPER_NUMBER = "917075210801";

        // Custom Hooks
        const useLocalState = (key, defaultValue) => {
            const [state, setState] = useState(() => {
                const stored = localStorage.getItem(key);
                return stored ? JSON.parse(stored) : defaultValue;
            });

            useEffect(() => {
                localStorage.setItem(key, JSON.stringify(state));
            }, [key, state]);

            return [state, setState];
        };

        // Notification Component
        const Notification = ({ message, type = 'success', onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 4000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                warning: 'bg-yellow-500',
                info: 'bg-blue-500'
            };

            return (
                <div className={`notification ${bgColors[type]} text-white fade-in`}>
                    <div className="flex items-center gap-2">
                        <i className={`fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}`}></i>
                        <span>{message}</span>
                        <button
                            onClick={onClose}
                            className="ml-2 hover:bg-black hover:bg-opacity-20 rounded-full p-1"
                        >
                            <i className="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            );
        };

        // Loading Spinner Component
        const LoadingSpinner = ({ size = 'md', color = 'blue' }) => {
            const sizes = {
                sm: 'w-4 h-4',
                md: 'w-6 h-6',
                lg: 'w-8 h-8'
            };

            return (
                <div className={`loading-spinner ${sizes[size]}`}></div>
            );
        };

        // Main App Component
        function SalesApp() {
            const [products, setProducts] = useState([]);
            const [filteredProducts, setFilteredProducts] = useState([]);
            const [categories, setCategories] = useState([]);
            const [cart, setCart] = useState({});
            const [selectedCategory, setSelectedCategory] = useState('');
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            const [showCart, setShowCart] = useState(false);
            const [notifications, setNotifications] = useState([]);

            // Load data on mount
            useEffect(() => {
                initData();
            }, []);

            // Filter products based on category and search
            useEffect(() => {
                let filtered = products;

                if (selectedCategory) {
                    filtered = filtered.filter(p => p.category === selectedCategory);
                }

                if (searchTerm) {
                    filtered = filtered.filter(p =>
                        p.name.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }

                setFilteredProducts(filtered);
            }, [products, selectedCategory, searchTerm]);

            const initData = async () => {
                try {
                    await Promise.all([loadProducts(), loadCategories()]);
                } catch (error) {
                    console.error('Failed to load data:', error);
                    showNotification('Failed to load data. Please refresh the page.', 'error');
                } finally {
                    setLoading(false);
                }
            };

            const loadProducts = async () => {
                const response = await fetch(`${BACKEND_URL}/products`);
                if (!response.ok) throw new Error('Failed to load products');
                const data = await response.json();
                setProducts(data);
                setFilteredProducts(data);
            };

            const loadCategories = async () => {
                try {
                    const response = await fetch(`${BACKEND_URL}/categories`);
                    if (response.ok) {
                        const data = await response.json();
                        setCategories(data);
                    }
                } catch (error) {
                    console.log('Categories not available');
                }
            };

            const showNotification = useCallback((message, type = 'success') => {
                const id = Date.now();
                setNotifications(prev => [...prev, { id, message, type }]);

                setTimeout(() => {
                    setNotifications(prev => prev.filter(n => n.id !== id));
                }, 4000);
            }, []);

            const closeNotification = useCallback((id) => {
                setNotifications(prev => prev.filter(n => n.id !== id));
            }, []);

            const addToCart = useCallback(async (cartKey) => {
                let productId, proportion = null;
                if (cartKey.includes('_')) {
                    [productId, proportion] = cartKey.split('_');
                    productId = parseInt(productId);
                } else {
                    productId = parseInt(cartKey);
                }

                const product = products.find(p => p.id === productId);
                if (!product) {
                    showNotification("Product not found!", 'error');
                    return;
                }

                let availableStock = product.stock || 0;
                let displayName = product.name;
                let itemPrice = product.price;

                if (proportion) {
                    if (product.proportion_stocks && product.proportion_stocks[proportion] !== undefined) {
                        availableStock = product.proportion_stocks[proportion];
                    }
                    displayName = `${product.name} (${proportion})`;

                    try {
                        const priceResponse = await fetch(`${BACKEND_URL}/products/${productId}/price/${proportion}`);
                        if (priceResponse.ok) {
                            const priceData = await priceResponse.json();
                            itemPrice = priceData.price;
                        }
                    } catch (error) {
                        console.warn(`Error fetching proportion price for ${displayName}:`, error);
                    }
                }

                if (availableStock <= 0) {
                    showNotification(`Sorry, ${displayName} is out of stock!`, 'warning');
                    return;
                }

                setCart(prev => {
                    const currentQty = prev[cartKey] ? prev[cartKey].quantity : 0;
                    if (currentQty + 1 > availableStock) {
                        showNotification(`Sorry, only ${availableStock} units available!`, 'warning');
                        return prev;
                    }

                    return {
                        ...prev,
                        [cartKey]: {
                            quantity: (prev[cartKey]?.quantity || 0) + 1,
                            price: itemPrice
                        }
                    };
                });

                showNotification(`Added ${displayName} to your cart`);
            }, [products, showNotification]);

            const updateCartItem = useCallback((cartKey, change) => {
                setCart(prev => {
                    const current = prev[cartKey];
                    if (!current) return prev;

                    let productId, proportion = null;
                    if (cartKey.includes('_')) {
                        [productId, proportion] = cartKey.split('_');
                        productId = parseInt(productId);
                    } else {
                        productId = parseInt(cartKey);
                    }

                    const product = products.find(p => p.id === productId);
                    let availableStock = product ? product.stock || 0 : 0;

                    if (proportion && product?.proportion_stocks?.[proportion] !== undefined) {
                        availableStock = product.proportion_stocks[proportion];
                    }

                    const newQty = current.quantity + change;

                    if (newQty <= 0) {
                        const { [cartKey]: removed, ...rest } = prev;
                        return rest;
                    }

                    if (newQty > availableStock) {
                        showNotification('Maximum stock available', 'warning');
                        return prev;
                    }

                    return {
                        ...prev,
                        [cartKey]: { ...current, quantity: newQty }
                    };
                });
            }, [products, showNotification]);

            const removeFromCart = useCallback((cartKey) => {
                setCart(prev => {
                    const { [cartKey]: removed, ...rest } = prev;
                    return rest;
                });
                showNotification('Item removed from cart');
            }, [showNotification]);

            // Calculate cart summary
            const cartSummary = useMemo(() => {
                let total = 0;
                let count = 0;

                Object.entries(cart).forEach(([cartKey, { quantity, price }]) => {
                    total += quantity * price;
                    count += quantity;
                });

                return { total, count };
            }, [cart]);

            const handleCheckout = useCallback(async () => {
                console.log('🎯 WhatsApp order button clicked');

                // Get form inputs
                const nameInput = document.querySelector('input[placeholder*="Your Full Name"]');
                const phoneInput = document.querySelector('input[placeholder*="Phone Number"]');
                const addressInput = document.querySelector('textarea[placeholder*="Delivery Address"]');
                const notesInput = document.querySelector('textarea[placeholder*="Special Instructions"]');

                const name = nameInput?.value?.trim() || '';
                const phone = phoneInput?.value?.trim() || '';
                const address = addressInput?.value?.trim() || '';
                const notes = notesInput?.value?.trim() || '';

                console.log('📋 Form data:', { name, phone, address, notes, cart });

                if (!name) {
                    showNotification('Please enter your full name', 'error');
                    nameInput?.focus();
                    return;
                }

                if (!phone || !/^[6-9]\d{9}$/.test(phone.replace(/\s+/g, ''))) {
                    showNotification('Please enter a valid 10-digit phone number', 'error');
                    phoneInput?.focus();
                    return;
                }

                if (!address) {
                    showNotification('Please enter your delivery address', 'error');
                    addressInput?.focus();
                    return;
                }

                const cartItems = Object.keys(cart).filter(cartKey => cart[cartKey]?.quantity > 0);
                console.log('🛒 Cart items:', cartItems);

                if (cartItems.length === 0) {
                    showNotification('Your cart is empty. Please add some products.', 'warning');
                    return;
                }

                // Calculate total
                let total = cartSummary.total;

                // Prepare order data for payment page
                const orderData = {
                    customer_name: name,
                    customer_phone: '+91' + phone,
                    customer_address: address,
                    customer_notes: notes,
                    items: cartItems.map(cartKey => {
                        let productId, proportion = null;
                        if (cartKey.includes('_')) {
                            [productId, proportion] = cartKey.split('_');
                            productId = parseInt(productId);
                        } else {
                            productId = parseInt(cartKey);
                        }

                        const product = products.find(p => p.id === productId);
                        const cartItem = cart[cartKey];

                        let displayName = product?.name || 'Unknown Product';
                        if (proportion) {
                            displayName += ` (${proportion})`;
                        }

                        return {
                            id: product?.id || productId,
                            name: displayName,
                            quantity: cartItem.quantity,
                            price: cartItem.price,
                            unit_type: product?.unit_type || 'unit'
                        };
                    }),
                    total: total,
                    order_date: new Date().toISOString()
                };

                // Store order data for payment page
                sessionStorage.setItem('pendingOrder', JSON.stringify(orderData));

                // Show processing state
                const checkoutButton = document.querySelector('.checkout-button');
                if (checkoutButton) {
                    checkoutButton.disabled = true;
                    checkoutButton.textContent = 'Processing...';
                }

                try {
                    // Send order to backend first
                    const backendResponse = await fetch(`${BACKEND_URL}/whatsapp-order/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            customer_name: name,
                            phone_number: '+91' + phone,
                            items: cartItems.map(cartKey => {
                                let productId, proportion = null;
                                if (cartKey.includes('_')) {
                                    [productId, proportion] = cartKey.split('_');
                                    productId = parseInt(productId);
                                } else {
                                    productId = parseInt(cartKey);
                                }

                                const product = products.find(p => p.id === productId);
                                const cartItem = cart[cartKey];

                                let productNameToSend = product?.name || 'Unknown Product';
                                if (proportion) {
                                    productNameToSend = `${product.name} (${proportion})`;
                                }

                                return {
                                    product_name: productNameToSend,
                                    quantity: cartItem.quantity
                                };
                            })
                        })
                    });

                    const data = await backendResponse.json();
                    console.log('Order processed:', data);

                    if (data.status === 'success') {
                        showNotification('✅ Order placed! Sending WhatsApp notifications...');

                        // Send notifications
                        await sendShopkeeperNotification(orderData, data);
                        showNotification('✅ Order sent to shopkeeper! Thanks message prepared.');
                    } else {
                        showNotification('❌ Order failed: ' + (data.message || 'Unknown error'), 'error');
                    }
                } catch (error) {
                    console.error('Order submission error:', error);
                    showNotification('❌ Failed to place order. Please try again.', 'error');
                } finally {
                    // Re-enable the button
                    if (checkoutButton) {
                        checkoutButton.disabled = false;
                        checkoutButton.textContent = '📱 Send Order to WhatsApp';
                    }
                }
            }, [cart, cartSummary, products, showNotification]);

            const sendShopkeeperNotification = useCallback(async (orderData, backendData) => {
                let shopkeeperMessage = `*NEW CUSTOMER ORDER*\n\n`;
                shopkeeperMessage += `👤 Customer: ${orderData.customer_name}\n`;
                shopkeeperMessage += `📞 Phone: ${orderData.customer_phone}\n`;
                shopkeeperMessage += `💳 Payment Method: Cash on Delivery\n\n`;

                shopkeeperMessage += `📦 ORDER DETAILS:\n────────────────────\n`;

                orderData.items.forEach(item => {
                    shopkeeperMessage += `${item.name} - ${item.quantity} × ₹${item.price.toFixed(2)} = ₹${(item.quantity * item.price).toFixed(2)}\n`;
                });

                shopkeeperMessage += `────────────────────\n*TOTAL: ₹${orderData.total.toFixed(2)}*\n\n`;

                shopkeeperMessage += `✅ Please confirm and process this order.\n`;
                shopkeeperMessage += `📅 Order placed on: ${new Date().toLocaleString('en-IN')}\n`;
                shopkeeperMessage += `🏪 Raza Wholesale and Retail Store\n`;

                const shopkeeperWhatsappUrl = `https://wa.me/${SHOPKEEPER_NUMBER}?text=${encodeURIComponent(shopkeeperMessage)}`;
                console.log('📱 Shopkeeper WhatsApp URL:', shopkeeperWhatsappUrl);

                try {
                    const shopkeeperWindow = window.open(shopkeeperWhatsappUrl, '_blank', 'noopener,noreferrer');
                    if (!shopkeeperWindow) {
                        console.warn('⚠️ Shopkeeper WhatsApp popup blocked');
                        showNotification('⚠️ Please allow popups to send WhatsApp messages', 'warning');
                    }
                } catch (error) {
                    console.error('❌ Error opening shopkeeper WhatsApp:', error);
                    showNotification('❌ Failed to open WhatsApp. Please check popup settings.', 'error');
                }

                // Prepare thanks message for clipboard
                const orderId = backendData?.order_id || 'ORDER_UNKNOWN';
                const paymentLink = `https://general-store-kappa.vercel.app/payment?order_id=${orderId}`;

                const thanksMessage = `🙏 *Thank You for Your Order!*\n\nDear ${orderData.customer_name},\n\n✅ Your order has been received successfully!\n\n📦 Order Summary:\n${orderData.items.map(item => `• ${item.name} (${item.quantity} ${item.unit_type})`).join('\n')}\n\n💰 Total Amount: ₹${orderData.total.toFixed(2)}\n\n🏠 Delivery Address: ${orderData.customer_address}\n\n📞 Contact: ${orderData.customer_phone}\n\n💳 *Payment Options:*\n• Cash on Delivery\n• Online Payment (UPI/Google Pay/PhonePe)\n• Bank Transfer\n\n💳 *Pay Online:*\n${paymentLink}\n\n📅 We will deliver your fresh products within 1-2 hours.\n\n🏪 *Raza Wholesale and Retail Store*\n🚚 *Fresh Products • Best Prices • Fast Delivery*\n📞 +91 7075210801`;

                // Copy to clipboard
                try {
                    await navigator.clipboard.writeText(thanksMessage);
                    showNotification('✅ Thanks message copied to clipboard!');
                } catch (error) {
                    console.warn('Could not copy to clipboard:', error);
                    // Fallback method
                    const textArea = document.createElement('textarea');
                    textArea.value = thanksMessage;
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-999999px';
                    textArea.style.top = '-999999px';
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        showNotification('✅ Thanks message copied to clipboard!');
                    } catch (fallbackError) {
                        console.warn('Fallback copy also failed:', fallbackError);
                    } finally {
                        document.body.removeChild(textArea);
                    }
                }

                // Reset cart and close modal after a delay
                setTimeout(() => {
                    setCart({});
                    setShowCart(false);

                    // Reset form fields
                    const nameInput = document.querySelector('input[placeholder*="Your Full Name"]');
                    const phoneInput = document.querySelector('input[placeholder*="Phone Number"]');
                    const addressInput = document.querySelector('textarea[placeholder*="Delivery Address"]');
                    const notesInput = document.querySelector('textarea[placeholder*="Special Instructions"]');

                    if (nameInput) nameInput.value = '';
                    if (phoneInput) phoneInput.value = '';
                    if (addressInput) addressInput.value = '';
                    if (notesInput) notesInput.value = '';
                }, 2000);
            }, [setCart, setShowCart, showNotification]);

            return (
                <>
                    <Header />
                    <main className="gradient-bg">
                        <div className="w-full max-w-7xl mx-auto p-4 space-y-8">
                            <SearchAndFilter
                                categories={categories}
                                selectedCategory={selectedCategory}
                                onCategoryChange={setSelectedCategory}
                                searchTerm={searchTerm}
                                onSearchChange={setSearchTerm}
                            />



                            <ProductsGrid
                                products={filteredProducts}
                                loading={loading}
                                addToCart={addToCart}
                            />

                            <CartButton
                                count={cartSummary.count}
                                onClick={() => setShowCart(true)}
                            />
                        </div>
                    </main>

                    <CartModal
                        isOpen={showCart}
                        cart={cart}
                        products={products}
                        cartSummary={cartSummary}
                        onClose={() => setShowCart(false)}
                        onUpdateItem={updateCartItem}
                        onRemoveItem={removeFromCart}
                        onCheckout={handleCheckout}
                    />

                    <Notifications
                        notifications={notifications}
                        onClose={closeNotification}
                    />
                </>
            );
        }

        // Header Component
        const Header = () => (
            <header className="w-full bg-gradient-to-r from-green-500 to-green-600 shadow-xl p-4 sticky top-0 z-40">
                <div className="max-w-7xl mx-auto flex justify-between items-center">
                    <div className="text-center">
                        <h1 className="text-xl md:text-2xl font-bold mb-1 text-white">
                            🛒 Raza Wholesale and Retail
                        </h1>
                        <p className="text-sm md:text-base text-green-100">
                            Fresh Products • Best Prices • Fast Delivery
                        </p>
                        <p className="text-sm text-green-200 font-medium">
                            📞 +91 7075210801
                        </p>
                    </div>

                    <div className="text-white text-right hidden sm:block">
                        <div className="text-sm opacity-90">Contact us:</div>
                        <div className="font-semibold">+91 7075210801</div>
                    </div>
                </div>
            </header>
        );

        // Search and Filter Component
        const SearchAndFilter = ({ categories, selectedCategory, onCategoryChange, searchTerm, onSearchChange }) => (
            <div className="bg-white/90 backdrop-blur-sm p-6 rounded-2xl shadow-xl slide-up">
                <div className="grid md:grid-cols-2 gap-4">
                    <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                            <i className="fas fa-filter mr-2"></i>Filter by Category
                        </label>
                        <select
                            value={selectedCategory}
                            onChange={(e) => onCategoryChange(e.target.value)}
                            className="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all"
                        >
                            <option value="">All Categories</option>
                            {categories.map(cat => (
                                <option key={cat.name} value={cat.name}>{cat.name}</option>
                            ))}
                        </select>
                    </div>

                    <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                            <i className="fas fa-search mr-2"></i>Search Products
                        </label>
                        <div className="relative">
                            <input
                                type="text"
                                value={searchTerm}
                                onChange={(e) => onSearchChange(e.target.value)}
                                placeholder="Search for products..."
                                className="w-full p-3 pl-10 border-2 border-gray-200 rounded-xl focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all"
                            />
                            <i className="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        </div>
                    </div>
                </div>
            </div>
        );

        // Quick Order Section Component
        const QuickOrderSection = ({ onQuickOrder }) => (
            <div className="bg-white/90 backdrop-blur-sm p-6 rounded-2xl shadow-xl slide-up">
                <h3 className="text-2xl font-bold text-gray-800 mb-6 text-center">
                    <i className="fas fa-bolt mr-2 text-yellow-500"></i>Quick Order Suggestions
                </h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {[
                        { name: 'Fruits', icon: '🍎', color: 'orange' },
                        { name: 'Dairy', icon: '🥛', color: 'blue' },
                        { name: 'Groceries', icon: '🛒', color: 'purple' }
                    ].map(({ name, icon, color }) => (
                        <button
                            key={name}
                            onClick={() => onQuickOrder(name)}
                            className={`bg-gradient-to-r from-${color}-500 to-${color}-600 text-white py-4 px-6 rounded-xl hover:from-${color}-600 hover:to-${color}-700 text-lg font-semibold transition-all transform hover:scale-105 shadow-lg hover:shadow-xl`}
                        >
                            <div className="flex items-center justify-center gap-3">
                                <span className="text-2xl">{icon}</span>
                                <span>Order {name}</span>
                                <i className="fas fa-arrow-right"></i>
                            </div>
                        </button>
                    ))}
                </div>
            </div>
        );

        // Products Grid Component
        const ProductsGrid = ({ products, loading, addToCart }) => {
            if (loading) {
                return (
                    <div className="grid product-grid fade-in">
                        {[...Array(8)].map((_, i) => (
                            <div key={i} className="product-card p-6 rounded-xl animate-pulse">
                                <div className="h-4 bg-gray-300 rounded mb-3"></div>
                                <div className="h-6 bg-gray-300 rounded mb-4 w-1/2"></div>
                                <div className="h-10 bg-gray-300 rounded"></div>
                            </div>
                        ))}
                    </div>
                );
            }

            if (products.length === 0) {
                return (
                    <div className="text-center py-16 fade-in">
                        <i className="fas fa-shopping-basket text-6xl text-gray-300 mb-4"></i>
                        <h3 className="text-2xl font-semibold text-gray-500 mb-2">No products found</h3>
                        <p className="text-gray-400">Try adjusting your search or category filter</p>
                    </div>
                );
            }

            return (
                <div className="grid product-grid fade-in">
                    {products.map(product => (
                        <ProductCard
                            key={product.id}
                            product={product}
                            onAddToCart={addToCart}
                        />
                    ))}
                </div>
            );
        };

        // Product Card Component
        const ProductCard = ({ product, onAddToCart }) => {
            const isOutOfStock = product.stock <= 0;

            if (product.proportions?.length > 0) {
                return (
                    <div className="product-card p-6 rounded-2xl text-center bounce-in">
                        <h4 className="font-bold text-lg text-gray-800 mb-3 line-clamp-2">
                            {product.name}
                        </h4>
                        <p className="text-2xl font-bold text-green-600 mb-4">
                            ₹{product.price}
                        </p>
                        <div className="grid grid-cols-3 gap-2">
                            {product.proportions.map(proportion => (
                                <button
                                    key={proportion}
                                    onClick={() => !isOutOfStock && onAddToCart(`${product.id}_${proportion}`)}
                                    disabled={isOutOfStock}
                                    className={`py-2 px-3 rounded-lg text-xs font-bold transition-all ${
                                        isOutOfStock
                                            ? 'bg-gray-400 text-gray-600 cursor-not-allowed'
                                            : 'bg-blue-500 hover:bg-blue-600 text-white hover:shadow-md'
                                    }`}
                                >
                                    {proportion} {isOutOfStock && '(Out)'}
                                </button>
                            ))}
                        </div>
                    </div>
                );
            }

            return (
                <div className="product-card p-6 rounded-2xl text-center bounce-in">
                    <h4 className="font-bold text-lg text-gray-800 mb-3 line-clamp-2">
                        {product.name}
                    </h4>
                    <p className="text-2xl font-bold text-green-600 mb-4">
                        ₹{product.price}
                    </p>
                    <button
                        onClick={() => !isOutOfStock && onAddToCart(product.id.toString())}
                        disabled={isOutOfStock}
                        className={`w-full py-3 px-4 rounded-xl font-semibold text-lg transition-all ${
                            isOutOfStock
                                ? 'bg-gray-400 text-gray-600 cursor-not-allowed'
                                : 'bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white shadow-lg hover:shadow-xl hover:scale-105'
                        }`}
                    >
                        {isOutOfStock ? 'Out of Stock' : 'Add to Cart'}
                    </button>
                </div>
            );
        };

        // Cart Button Component
        const CartButton = ({ count, onClick }) => (
            <div className="cart-floating">
                <button
                    onClick={onClick}
                    className={`bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white p-4 rounded-full shadow-2xl hover:shadow-3xl transition-all transform ${
                        count > 0 ? 'pulse-cart scale-110' : 'scale-100'
                    }`}
                >
                    <div className="flex items-center gap-2">
                        <i className="fas fa-shopping-cart text-xl"></i>
                        {count > 0 && (
                            <span className="bg-red-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center absolute -top-1 -right-1">
                                {count}
                            </span>
                        )}
                    </div>
                </button>
            </div>
        );

        // Cart Modal Component
        const CartModal = ({ isOpen, cart, products, cartSummary, onClose, onUpdateItem, onRemoveItem, onCheckout }) => {
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md flex flex-col max-h-[95vh] overflow-hidden slide-up">
                        {/* Header - Fixed */}
                        <div className="flex justify-between items-center p-6 border-b flex-shrink-0">
                            <h3 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
                                <i className="fas fa-shopping-cart text-green-500"></i>
                                Your Order
                            </h3>
                            <button
                                onClick={onClose}
                                className="text-gray-400 hover:text-gray-600 flex-shrink-0"
                            >
                                <i className="fas fa-times text-xl"></i>
                            </button>
                        </div>

                        {/* Scrollable Content Area */}
                        <div className="flex-1 overflow-y-auto">
                            {/* Cart Items */}
                            <div className="p-6 space-y-4">
                                {Object.keys(cart).length === 0 ? (
                                    <div className="text-center py-8">
                                        <i className="fas fa-shopping-basket text-6xl text-gray-300 mb-4"></i>
                                        <p className="text-gray-500 text-lg">Your cart is empty</p>
                                    </div>
                                ) : (
                                    Object.entries(cart).map(([cartKey, { quantity, price }]) => {
                                        let productId, proportion = null;
                                        if (cartKey.includes('_')) {
                                            [productId, proportion] = cartKey.split('_');
                                            productId = parseInt(productId);
                                        } else {
                                            productId = parseInt(cartKey);
                                        }

                                        const product = products.find(p => p.id === productId);
                                        if (!product) return null;

                                        const displayName = proportion ? `${product.name} (${proportion})` : product.name;
                                        const subtotal = quantity * price;

                                        return (
                                            <div key={cartKey} className="grid grid-cols-[2fr_140px_100px] gap-4 items-center bg-gray-50 p-4 rounded-xl">
                                                <div className="min-w-0">
                                                    <div className="font-semibold text-gray-800 mb-1 break-words">{displayName}</div>
                                                    <div className="text-sm text-gray-600">₹{price.toFixed(2)} each</div>
                                                </div>

                                                <div className="flex flex-col items-center justify-center gap-2">
                                                    <div className="flex items-center justify-center gap-3">
                                                        <button
                                                            onClick={() => onUpdateItem(cartKey, -1)}
                                                            className="w-8 h-8 bg-red-500 text-white rounded-full flex items-center justify-center hover:bg-red-600 transition-colors active:scale-95 shadow-sm"
                                                        >
                                                            <i className="fas fa-minus text-xs font-bold"></i>
                                                        </button>
                                                        <span className="w-8 text-center font-bold text-lg tabular-nums">{quantity}</span>
                                                        <button
                                                            onClick={() => onUpdateItem(cartKey, 1)}
                                                            className="w-8 h-8 bg-green-500 text-white rounded-full flex items-center justify-center hover:bg-green-600 transition-colors active:scale-95 shadow-sm"
                                                        >
                                                            <i className="fas fa-plus text-xs font-bold"></i>
                                                        </button>
                                                    </div>
                                                    <button
                                                        onClick={() => onRemoveItem(cartKey)}
                                                        className="text-red-500 text-xs hover:text-red-700 active:scale-95 font-medium px-2 py-1 rounded hover:bg-red-50 transition-colors"
                                                    >
                                                        Remove
                                                    </button>
                                                </div>

                                                <div className="text-right">
                                                    <div className="font-bold text-gray-800 text-lg">₹{subtotal.toFixed(2)}</div>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>

                            {/* Checkout Form - Only show when cart has items */}
                            {Object.keys(cart).length > 0 && (
                                <div className="border-t p-6 space-y-4">
                                    <div className="flex justify-between text-xl font-bold">
                                        <span>Total Amount:</span>
                                        <span className="text-green-600">₹{cartSummary.total.toFixed(2)}</span>
                                    </div>

                                    <div className="space-y-3">
                                        <input
                                            type="text"
                                            placeholder="Your Full Name *"
                                            className="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all"
                                        />
                                        <input
                                            type="tel"
                                            placeholder="Phone Number *"
                                            className="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all"
                                        />
                                        <textarea
                                            placeholder="Delivery Address *"
                                            rows="2"
                                            className="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all resize-vertical"
                                        ></textarea>
                                        <textarea
                                            placeholder="Special Instructions (Optional)"
                                            rows="2"
                                            className="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all resize-vertical"
                                        ></textarea>
                                    </div>

                                    <button
                                        onClick={onCheckout}
                                        className="w-full bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white py-4 px-6 rounded-xl shadow-xl hover:shadow-2xl font-bold text-lg transition-all transform hover:scale-105 active:scale-95 checkout-button"
                                    >
                                        <i className="fab fa-whatsapp mr-2"></i>
                                        Send Order to WhatsApp
                                    </button>

                                    <p className="text-xs text-gray-500 text-center">
                                        We'll confirm your order and deliver to your doorstep!
                                    </p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // Notifications Container Component
        const Notifications = ({ notifications, onClose }) => (
            <>
                {notifications.map(notification => (
                    <Notification
                        key={notification.id}
                        message={notification.message}
                        type={notification.type}
                        onClose={() => onClose(notification.id)}
                    />
                ))}
            </>
        );

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SalesApp />);
    </script>
</body>
</html>
