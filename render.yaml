services:
  - type: web
    name: kirana-store-backend
    env: python
    runtime: python-3.11
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kirana-store-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: USE_SQLITE
        value: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

databases:
  - name: kirana-store-db
    plan: free
    databaseName: kirana_store
    user: kirana_user